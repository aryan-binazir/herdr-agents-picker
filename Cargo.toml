[package]
name = "agents-picker"
version = "0.2.3"
edition = "2024"
description = "Workspace-picker-style fuzzy picker for Herdr-detected agent panes"
license = "MIT"
repository = "https://github.com/aryan-binazir/herdr-agents-picker"
readme = "README.md"
publish = false

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

[lints.rust]
unsafe_code = "forbid"
future-incompatible = "warn"
nonstandard-style = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
needless_collect = "warn"
redundant_clone = "warn"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
strip = true
codegen-units = 1
